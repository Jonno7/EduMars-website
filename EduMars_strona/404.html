<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 – EduMars</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #080b20;
    color: white;
    overflow: hidden;
}

.page {
    position: relative;
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;

    background-image:
        linear-gradient(
            90deg,
            rgba(5, 8, 28, 0.94) 0%,
            rgba(5, 8, 28, 0.82) 30%,
            rgba(5, 8, 28, 0.35) 55%,
            rgba(5, 8, 28, 0.05) 100%
        ),
        url("./404-edumars.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Gwiazdy */

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    background: white;
    border-radius: 50%;

    box-shadow: 0 0 8px white;

    animation: stars 4s ease-in-out infinite;
}

.star:nth-child(1) {
    top: 12%;
    left: 8%;
}

.star:nth-child(2) {
    top: 20%;
    left: 19%;
    animation-delay: 1s;
}

.star:nth-child(3) {
    top: 8%;
    left: 37%;
    animation-delay: 2s;
}

.star:nth-child(4) {
    top: 30%;
    left: 48%;
    animation-delay: 0.5s;
}

.star:nth-child(5) {
    top: 15%;
    left: 67%;
    animation-delay: 2.5s;
}

.star:nth-child(6) {
    top: 42%;
    left: 83%;
    animation-delay: 1.5s;
}

@keyframes stars {

    0%,
    100% {
        opacity: 0.3;
        transform: scale(0.8);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* Kometa */

.comet {
    position: absolute;

    width: 120px;
    height: 3px;

    top: 20%;
    left: -150px;

    border-radius: 50%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(170, 230, 255, 0.6),
        white
    );

    box-shadow:
        0 0 10px white,
        0 0 25px rgba(100, 200, 255, 0.7);

    transform: rotate(-18deg);

    animation: comet 11s linear infinite;

    z-index: 3;
}

.comet::after {
    content: "";

    position: absolute;

    right: 0;
    top: 50%;

    width: 8px;
    height: 8px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 20px #bcecff;
}

@keyframes comet {

    0% {
        left: -150px;
        opacity: 0;
    }

    5% {
        opacity: 1;
    }

    45% {
        left: 60%;
        opacity: 1;
    }

    50% {
        left: 75%;
        opacity: 0;
    }

    100% {
        left: 120%;
        opacity: 0;
    }
}

/* Panel */

.content {
    position: relative;
    z-index: 10;

    width: min(600px, 90%);

    margin-left: clamp(25px, 8vw, 120px);

    padding: 45px;

    border-radius: 28px;

    background: rgba(7, 10, 32, 0.72);

    border: 1px solid rgba(255,255,255,0.14);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.5);

    animation: appear 0.8s ease-out;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Logo */

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-bottom: 15px;

    font-size: 1.2rem;
    font-weight: 700;
}

.logo-dot {
    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #ff6b35;

    box-shadow:
        0 0 10px #ff6b35,
        0 0 25px rgba(255,107,53,0.5);
}

/* 404 */

.error {
    font-size: clamp(6rem, 14vw, 10rem);

    line-height: 0.85;

    font-weight: 900;

    letter-spacing: -8px;

    background: linear-gradient(
        135deg,
        white,
        #ffb08c,
        #ff6b35
    );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    margin-bottom: 25px;
}

/* Tekst */

h1 {
    font-size: clamp(2rem, 4vw, 3rem);

    line-height: 1.15;

    margin-bottom: 18px;
}

.description {
    color: rgba(255,255,255,0.78);

    font-size: 1.05rem;

    line-height: 1.7;
}

/* Misja */

.mission {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-top: 22px;

    color: #ffb08c;

    font-weight: 600;
}

.mission-line {
    width: 35px;
    height: 2px;

    background: #ff6b35;

    border-radius: 5px;
}

/* Przycisk */

.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    margin-top: 30px;

    padding: 15px 25px;

    color: white;

    text-decoration: none;

    font-weight: 700;

    background: linear-gradient(
        135deg,
        #ff6b35,
        #e94f27
    );

    border-radius: 14px;

    box-shadow:
        0 10px 30px rgba(255,107,53,0.3);

    transition: 0.25s ease;
}

.button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 40px rgba(255,107,53,0.5);
}

/* Telefon */

@media (max-width: 800px) {

    .page {
        align-items: flex-end;

        background-position: 65% center;
    }

    .content {
        width: calc(100% - 30px);

        margin: 0 15px 20px;

        padding: 30px;

        background: rgba(7,10,32,0.82);
    }

    .error {
        font-size: 6rem;
    }
}

@media (max-width: 500px) {

    body {
        overflow: auto;
    }

    .page {
        min-height: 100svh;
        height: auto;

        padding-bottom: 20px;
    }

    .content {
        padding: 25px 20px;
    }

    .error {
        font-size: 5rem;
    }

    h1 {
        font-size: 1.8rem;
    }

    .button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- Gwiazdy -->
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>

    <!-- Kometa -->
    <div class="comet"></div>

    <!-- Zawartość -->
    <main class="content">

        <div class="logo">
            <span class="logo-dot"></span>
            EduMars
        </div>

        <div class="error">
            404
        </div>

        <h1>
            Ups, zgubiłeś się<br>
            na Marsie 🚀
        </h1>

        <p class="description">
            Wygląda na to, że ta strona nie istnieje,
            została przeniesiona albo astronauta EduMars
            zabrał ją ze sobą na Marsa.
        </p>

        <div class="mission">
            <span class="mission-line"></span>
            Misja EduMars trwa dalej
        </div>

        <a href="/" class="button">
            ← Wróć na stronę główną
        </a>

    </main>

</div>

</body>
</html>
